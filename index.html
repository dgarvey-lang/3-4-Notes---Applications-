<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3-4 Notes Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* Layout: sticky header with progress dots; two columns — question work on the left, whiteboard on the right (stacks on phones). */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #18202c;
  --muted: #586273;
  --line: #d8dde6;
  --accent: #2453c4;
  --accent-soft: #e6edfb;
  --accent-ink: #ffffff;
  --good: #1b7543;
  --good-bg: #e2f3e9;
  --bad: #b3232c;
  --bad-bg: #fbe6e7;
  --warn: #8f5600;
  --warn-bg: #fcf0d9;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 16px rgba(20, 30, 50, .06);
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-math: "Cambria Math", "STIX Two Math", "Latin Modern Math", math, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #171d27; --surface-2: #1c2330; --ink: #e5e9f0; --muted: #9aa4b4; --line: #2b3545;
    --accent: #86a8ff; --accent-soft: #1e2b47; --accent-ink: #0c1222;
    --good: #67d397; --good-bg: #13311f; --bad: #ff8f95; --bad-bg: #3b1a1d; --warn: #f3b85e; --warn-bg: #3a2b12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171d27; --surface-2: #1c2330; --ink: #e5e9f0; --muted: #9aa4b4; --line: #2b3545;
  --accent: #86a8ff; --accent-soft: #1e2b47; --accent-ink: #0c1222;
  --good: #67d397; --good-bg: #13311f; --bad: #ff8f95; --bad-bg: #3b1a1d; --warn: #f3b85e; --warn-bg: #3a2b12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
math { font-family: var(--font-math); }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 1.15rem; }
.brand span { font-size: .78rem; color: var(--muted); }
.dots { display: flex; flex-wrap: wrap; gap: 5px; flex: 1 1 260px; min-width: 0; }
.dot {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface-2);
  font-size: .7rem; font-weight: 600; display: grid; place-items: center; color: var(--muted); padding: 0;
  font-variant-numeric: tabular-nums;
}
.dot.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.dot.retry { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.dot.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.dot.current { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.dot.extra { border-style: dashed; }
.top-actions { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.help { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* Main two-column layout */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1500px; margin: 0 auto;
}
.work { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }

/* Question card */
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.badge { font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.equation {
  margin: 14px 0 4px; padding: 18px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
  font-size: 1.6rem; text-align: center; overflow-x: auto;
}
.step { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.step h3 { font-size: 1.02rem; display: flex; gap: 10px; align-items: center; }
.step-num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .8rem;
  display: grid; place-items: center; flex: none;
}
.methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.method {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.method b { font-size: .92rem; }
.method small { color: var(--muted); font-size: .78rem; }
.method:hover:not(:disabled) { border-color: var(--accent); }
.method.sel { border-color: var(--accent); background: var(--accent-soft); }
.method.right { border-color: var(--good); background: var(--good-bg); }
.method.wrong { border-color: var(--bad); background: var(--bad-bg); }
.method.ok { border-color: var(--warn); background: var(--warn-bg); }
.method:disabled { cursor: default; }
.method:disabled:not(.right):not(.wrong):not(.ok) { opacity: .55; }

.feedback { border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; }
.feedback .icon { font-weight: 700; font-size: 1.1rem; line-height: 1.2; flex: none; width: 22px; text-align: center; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.warn { background: var(--warn-bg); color: var(--warn); }
.feedback p { margin: 0; color: var(--ink); }
.feedback strong { color: inherit; }

.answer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.answer-row label { font-family: var(--font-math); font-size: 1.25rem; font-style: italic; }
.answer-row input {
  flex: 1 1 220px; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 8px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.keypad { display: flex; gap: 6px; flex-wrap: wrap; }
.key {
  min-width: 42px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 1rem; font-family: var(--font-math);
}
.key:hover { border-color: var(--accent); }
.preview { min-height: 38px; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--line); font-size: 1.15rem; overflow-x: auto; }
.preview .ph { font-family: var(--font-body); font-size: .85rem; color: var(--muted); }
.preview .err { font-family: var(--font-body); font-size: .85rem; color: var(--bad); }
.hint-line { font-size: .82rem; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.solution { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.solution h4 { margin: 0 0 8px; font-family: var(--font-display); font-size: .95rem; }
.solution ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.solution li p { margin: 0 0 2px; font-size: .9rem; color: var(--muted); }
.solution .m { font-size: 1.1rem; overflow-x: auto; }
.nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Summary */
.score-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.score { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface-2); }
.score b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.score span { font-size: .8rem; color: var(--muted); }
.table-wrap { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.strong { background: var(--good-bg); color: var(--good); }
.pill.weak { background: var(--bad-bg); color: var(--bad); }
.pill.none { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.help-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.help-item {
  border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 8px; padding: 12px 14px;
  display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap;
}
.help-item div { min-width: 0; flex: 1 1 260px; }
.help-item b { display: block; }
.help-item p { margin: 2px 0 0; font-size: .87rem; color: var(--muted); }
.muted { color: var(--muted); }

/* Whiteboard */
.board {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h, 64px) + 12px);
  height: calc(100vh - var(--header-h, 64px) - 36px - env(safe-area-inset-top, 0px));
  min-height: 420px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
}
.board-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.board-title { font-family: var(--font-display); font-weight: 600; font-size: .95rem; margin-right: auto; }
.tool {
  height: 32px; min-width: 32px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.tool.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.canvas-wrap {
  position: relative; flex: 1; min-height: 0; background-color: #ffffff;
  background-image: linear-gradient(#e9edf3 1px, transparent 1px), linear-gradient(90deg, #e9edf3 1px, transparent 1px);
  background-size: 28px 28px;
}
.canvas-wrap.nogrid { background-image: none; }
.canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

/* Help modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10, 15, 25, .5); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--surface); border-radius: 14px; width: min(720px, 100%); max-height: 100%; overflow-y: auto; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.modal-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 22px; }
.modal-body h3 { font-size: 1rem; margin-bottom: 8px; }
.modal-body p { margin: 0 0 6px; }
.guide { display: grid; gap: 8px; }
.guide div { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: .88rem; align-items: center; }
.guide div b { color: var(--accent); }
.typing { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: .88rem; }
.typing code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.hint-steps { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
.hint-steps .h { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.hint-steps .h p { margin: 0 0 4px; font-size: .88rem; color: var(--muted); }
.hint-steps .m { font-size: 1.05rem; overflow-x: auto; }

[hidden] { display: none !important; }
.graph { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
.graph h4 { margin: 0 0 8px; font-family: var(--font-display); font-size: .95rem; }
.graph p { margin: 8px 0 0; font-size: .9rem; }
.graph-svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.g-grid { stroke: var(--line); stroke-width: 1; }
.g-axis { stroke: var(--muted); stroke-width: 1.5; }
.g-curve { fill: none; stroke: var(--accent); stroke-width: 3; }
.g-dot { fill: var(--good); stroke: var(--surface); stroke-width: 2; }
.g-tick { fill: var(--muted); font: 13px var(--font-body); }
.g-lab { fill: var(--good); font: 600 15px var(--font-body); }

.problem { margin: 14px 0 4px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 1.02rem; line-height: 1.6; }
.method.eqc { align-items: center; justify-content: center; font-size: 1.12rem; min-height: 54px; overflow-x: auto; }
.unit { color: var(--muted); font-size: .88rem; }
.answer-row label { font-family: var(--font-body); font-style: normal; font-size: 1rem; font-weight: 600; }
.answer-row input { flex: 1 1 140px; max-width: 220px; }
.g-level { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.g-title { fill: var(--muted); font: 600 14px var(--font-body); }

.calc { position: fixed; z-index: 15; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 32px rgba(10,15,25,.25);
  padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.calc-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); }
.calc-in { font: 1.05rem var(--font-math); padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); min-width: 0; }
.calc-out { font: 600 1.5rem var(--font-display); text-align: right; font-variant-numeric: tabular-nums; overflow-x: auto; min-height: 2rem; }
.calc-out.err { font: .85rem var(--font-body); color: var(--bad); text-align: left; }
.calc-keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ck { padding: 9px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 1rem; font-family: var(--font-math); }
.ck:hover { border-color: var(--accent); }
.ck.fn { font-family: var(--font-body); font-size: .85rem; font-weight: 600; }
.ck.eq { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.method.defc { justify-content: center; font-size: .95rem; }
.work-grid { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.work-grid .answer-row input { flex: 0 1 110px; width: 110px; }
.score-row.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
a.btn { text-decoration: none; color: inherit; }
.graph a { color: var(--accent); font-weight: 600; }
.top-actions { flex-wrap: wrap; }

.desmos-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.dx { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dx code { font: 1rem ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; }
.dx .btn { padding: 5px 12px; font-size: .85rem; }
.desmos-check summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: .92rem; }
.desmos-check[open] summary { margin-bottom: 8px; }

@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .board { position: relative; top: auto; height: 520px; }
}
@media (max-width: 560px) {
  .methods { grid-template-columns: minmax(0, 1fr); }
  .score-row, .score-row.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .guide div { grid-template-columns: minmax(0, 1fr); }
  .equation { font-size: 1.3rem; }
  .panel { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
}
.g-rev { stroke: var(--warn); }
.g-name { fill: var(--accent); font: 600 13px var(--font-body); }
.g-rev-t { fill: var(--warn); }
</style>
</head><body>

<header class="top" id="top">
  <div class="brand">
    <h1>3-4 Notes Applications</h1>
    <span>Cost = Revenue: find the break-even point.</span>
  </div>
  <nav class="dots" id="dots" aria-label="Questions"></nav>
  <div class="top-actions">
    <button class="btn" id="calcBtn" type="button" aria-expanded="false">Calculator</button>
    <a class="btn" href="https://www.desmos.com/calculator" target="_blank" rel="noopener noreferrer">Desmos ↗</a>
    <button class="btn help" id="helpBtn" type="button">? Help</button>
    <button class="btn" id="summaryBtn" type="button">Summary</button>
  </div>
</header>

<main class="layout">
  <section class="work" id="work" aria-live="polite"></section>
  <aside class="board" aria-label="Whiteboard">
    <div class="board-bar">
      <span class="board-title" id="boardTitle">Whiteboard</span>
      <button class="swatch on" data-color="#18202c" style="background:#18202c" aria-label="Black pen" type="button"></button>
      <button class="swatch" data-color="#2453c4" style="background:#2453c4" aria-label="Blue pen" type="button"></button>
      <button class="swatch" data-color="#c62828" style="background:#c62828" aria-label="Red pen" type="button"></button>
      <button class="swatch" data-color="#1e7d3c" style="background:#1e7d3c" aria-label="Green pen" type="button"></button>
      <span class="sep"></span>
      <button class="tool on" id="penThin" type="button" title="Thin pen">Thin</button>
      <button class="tool" id="penThick" type="button" title="Thick pen">Thick</button>
      <button class="tool" id="eraser" type="button" title="Eraser">Eraser</button>
      <span class="sep"></span>
      <button class="tool" id="undo" type="button" title="Undo">Undo</button>
      <button class="tool" id="clear" type="button" title="Clear the board">Clear</button>
      <button class="tool on" id="grid" type="button" title="Show or hide grid">Grid</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas></div>
  </aside>
</main>

<div class="calc" id="calc" hidden role="dialog" aria-label="Calculator">

function genBE(forceFrac) {

function tokenize(str) {

/* ---------- Final answer check (whole number of items, rounded up) ---------- */
function checkAnswer(q, raw) {

  if (!q.whole && near(v, Math.floor(q.exact), 1e-6)) return { status: "wrong", round: true, msg: `Would ${Math.floor(q.exact)} be enough? Revenue would be ${money(q.p * Math.floor(q.exact))}, but cost would be ${money(q.I + q.c * Math.floor(q.exact))}. That's still a loss. Always round UP.` };
  if (!isInt(v)) return { status: "wrong", round: true, msg: `The answer is a number of ${q.items}, so it has to be a whole number. Check your division, then round UP if needed.` };
  if (near(v, Math.ceil(q.I / (q.p + q.c) - 1e-9), 0.6)) return { status: "wrong", msg: `It looks like you added ${num(q.c)} and ${num(q.p)}. Subtract ${num(q.c)}x from both sides: ${num(q.p)}x − ${num(q.c)}x = ${num(q.k)}x.` };

  if (near(v, Math.ceil(q.I / q.c - 1e-9), 0.6)) return { status: "wrong", msg: `It looks like you divided by the cost per ${q.item}. Divide by ${num(q.p)} − ${num(q.c)} = ${num(q.k)}.` };

    tally("cost", all.filter(r => r.costStatus), all.filter(r => r.costStatus === "right")),
    tally("rev", all.filter(r => r.revStatus), all.filter(r => r.revStatus === "right")),
    tally("method", all.filter(r => r.methodStatus), all.filter(r => r.methodStatus === "right")),
    tally("work", all.filter(r => r.workStatus), all.filter(r => r.workFirstOk)),

}

}
function addMore(count, forceFrac) {
  const seen = new Set(state.questions.map(q => q.text)), fresh = [];
  for (let i = 0; i < count; i++) {
    /* when rounding is the weak spot, every new problem needs rounding; otherwise mix, with at least one that does */
    let q, tries = 0; do { q = genBE(forceFrac || i === 0); tries++; } while (seen.has(q.text) && tries < 30);
    seen.add(q.text); fresh.push(q);
  }
  shuffle(fresh);
  const start = state.questions.length;
  fresh.forEach(q => { q.id = "q" + state.nextId++; q.extra = true; state.questions.push(q); });
  state.cur = start; state.view = "q"; render(); window.scrollTo({ top: 0 });
}

/* ---------- Help ---------- */
let helpSteps = 0;
function openHelp() { helpSteps = 0; renderHelp(); $("#helpModal").hidden = false; $("#helpClose").focus(); }
function closeHelp() { $("#helpModal").hidden = true; }
function renderHelp() {
  const q = state.view === "q" ? state.questions[state.cur] : null;
  let h = "";
  if (q) {
    const r = R(q.id);
    h += `<section><h3>Hint for question ${state.cur + 1}</h3>`;
    const stage = r.defStatus === null ? "def" : r.costStatus === null ? "cost" : r.revStatus === null ? "rev" : r.methodStatus === null ? "method" : !r.workStatus ? "work" : null;
    if (stage) {
      const info = {
        def: ["Start by defining the variable: what unknown is the question asking about?", "Variable hint", `The question asks "how many?" The variable stands for the number of ${q.items} sold.`],
        cost: ["Now write the cost equation.", "Cost hint", q.costHint],
        rev: ["Now write the revenue equation.", "Revenue hint", q.revHint],
        method: ["Now choose a method. Use the guide below to decide.", "Method hint", "Both equations are solved for the same thing (dollars). What can you do when two expressions are equal to the same amount?"],
        work: ["Now start solving.", "Work hint", usesGraph(q) ? "Copy both equations into Desmos. Zoom out until you see the lines cross, then click that point. Desmos shows its coordinates (x, y)." : `Write ${num(q.I)} + ${num(q.c)}x = ${num(q.p)}x. Subtract ${num(q.c)}x from both sides. What number is left in front of x?`],
      }[stage];
      h += `<p class="muted">${info[0]}</p>`;
      if (helpSteps > 0) h += `<div class="hint-steps"><div class="h"><p>${info[1]}</p><div>${esc(info[2])}</div></div></div>`;
      else h += `<button class="btn" id="hintNext" type="button">Show a hint</button>`;
    } else {
      h += `<p class="muted">Each click shows one more step of the solution.</p><div class="hint-steps">${q.steps.slice(0, helpSteps).map((s, i) => `<div class="h"><p>Step ${i + 1}: ${esc(s.t)}</p><div class="m">${M(s.m)}</div></div>`).join("")}</div>`;
      if (helpSteps < q.steps.length) h += `<button class="btn" id="hintNext" type="button">${helpSteps ? "Show the next step" : "Show the first step"}</button>`;
      else h += `<p class="muted">That's every step. Type the final answer in the box.</p>`;
    }
    h += `</section>`;
  }
  h += `<section><h3>Finding the break-even point</h3><div class="guide">
    <div><span>1. Define your variable</span><b>"Let x = number of items sold"</b></div>
    <div><span>2. Write the cost equation</span><b>${M("C = \\text{initial} + (\\text{cost per item})x")}</b></div>
    <div><span>3. Write the revenue equation</span><b>${M("R = (\\text{selling price})x")}</b></div>
    <div><span>4. Set cost equal to revenue and solve</span><b>${M("C = R")}</b></div>
    <div><span>5. Interpret</span><b>Whole number of items. Always round UP.</b></div>
  </div></section>
  <section><h3>Example from the notes</h3><div class="guide">
    <div><span>Cost: $10,410 equipment + $2.65 per game</span><b>${M("C = 10{,}410 + 2.65x")}</b></div>
    <div><span>Revenue: sells for $20 each</span><b>${M("R = 20x")}</b></div>
    <div><span>Cost = Revenue</span><b>${M("10{,}410 + 2.65x = 20x")}</b></div>
    <div><span>Subtract 2.65x from both sides</span><b>${M("10{,}410 = 17.35x")}</b></div>
    <div><span>Divide both sides by 17.35</span><b>${M("x = 600")} games</b></div>
  </div></section>
  <section><h3>Why round up?</h3><p>Suppose a company has to sell 34.3 widgets to break even. Would they break even selling only 34? No, they'd still lose a little money. So you always round UP: they need to sell <b>35</b> widgets.</p></section>
  <section><h3>How to pick the method</h3><div class="guide">
    <div><span>Both equations solved for the same thing (C = …, R = …)</span><b>Substitution: set them equal</b></div>
    <div><span>Equations lined up in standard form</span><b>Elimination</b></div>
    <div><span>Supporting or checking your answer</span><b>Graphing: where the lines cross</b></div>
  </div><div class="actions" style="margin-top:10px">${desmosLink()}</div></section>
  <section><h3>How to type answers</h3><div class="typing">
    <code>17.35</code><span>Decimals</span>
    <code>10410</code><span>Whole numbers (10,410 and $10,410 work too)</span>
    <code>10410/17.35</code><span>You can type the division; the box works it out</span>
    <code>600</code><span>Final answer: a whole number of items. Units are optional.</span>
  </div></section>
  <section><h3>Calculator</h3><p>Click <b>Calculator</b> at the top. Type or tap an expression like <code>10410 / 17.35</code>, press <b>=</b>, then round up if it isn't a whole number. <b>Put result in answer box</b> copies the full value into the box you last clicked.</p></section>`;
  $("#helpBody").innerHTML = h;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const q = state.view === "q" ? state.questions[state.cur] : null;
  if (t.dataset.copy !== undefined) { copyText(t.dataset.copy, t); return; }
  if (t.matches(".dot")) { state.cur = +t.dataset.i; state.view = "q"; render(); return; }
  if (t.id === "helpBtn" || t.hasAttribute("data-help")) { openHelp(); return; }
  if (t.id === "helpClose") { closeHelp(); return; }
  if (t.id === "hintNext") { helpSteps++; if (q) { R(q.id).hints++; save(); } renderHelp(); return; }
  if (t.id === "summaryBtn" || t.id === "toSummary") { state.view = "summary"; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === "backQ") { state.view = "q"; render(); return; }
  if (t.id === "prev") { state.cur--; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === "next") { state.cur++; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.more) { addMore(3, t.dataset.more === "round"); return; }
  if (t.id === "moreAll") { const w = analyze().filter(r => r.status === "weak"); addMore(Math.min(6, w.length * 2), w.length === 1 && w[0].key === "round"); return; }
  if (t.id === "restart") {
    if (t.dataset.confirm) { state = fresh(); Board.reset(); render(); return; }
    t.dataset.confirm = "1"; t.textContent = "Click again to erase all progress"; t.classList.add("primary"); return;
  }
  if (!q) return;
  const r = R(q.id);
  if (t.dataset.def !== undefined && r.defStatus === null) { r.defPick = +t.dataset.def; renderQuestion(); save(); return; }
  if (t.id === "checkDef" && r.defPick !== null) { r.defStatus = q.defs[r.defPick].ok ? "right" : "wrong"; render(); return; }
  if (t.dataset.cost !== undefined && r.costStatus === null) { r.costPick = +t.dataset.cost; renderQuestion(); save(); return; }
  if (t.id === "checkCost" && r.costPick !== null) { r.costStatus = q.costs[r.costPick].ok ? "right" : "wrong"; render(); return; }
  if (t.dataset.rev !== undefined && r.revStatus === null) { r.revPick = +t.dataset.rev; renderQuestion(); save(); return; }
  if (t.id === "checkRev" && r.revPick !== null) { r.revStatus = q.revs[r.revPick].ok ? "right" : "wrong"; render(); return; }
  if (t.dataset.method && r.methodStatus === null) { r.method = t.dataset.method; renderQuestion(); save(); return; }
  if (t.id === "checkMethod" && r.method) {
    r.methodStatus = methodStatusFor(r.method); r.methodOk = r.methodStatus === "right";
    render(); setTimeout(() => $("#wk0") && $("#wk0").focus(), 0); return;
  }
  if (t.id === "checkWork") { doWork(); return; }
  if (t.id === "showWork") { r.workStatus = "shown"; if (r.workFirstOk === null) r.workFirstOk = false; render(); setTimeout(() => $("#ans0") && $("#ans0").focus(), 0); return; }
  if (t.id === "checkAns") { doCheck(); return; }
  if (t.id === "reveal") { r.revealed = true; r.last = { status: "revealed" }; if (r.firstOk === null) r.firstOk = false; render(); return; }
});
let lastInputId = null;
document.addEventListener("focusin", e => {
  const c = e.target.classList; if (!c) return;
  if (c.contains("ans") || c.contains("wk")) lastInputId = e.target.id;
});
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("ans")) {
    const q = state.questions[state.cur]; state.drafts = state.drafts || {};
    const d = state.drafts[q.id] = state.drafts[q.id] || []; d[+e.target.dataset.field] = e.target.value; save();
  }
  if (e.target.classList && e.target.classList.contains("wk")) {
    const q = state.questions[state.cur]; state.wdrafts = state.wdrafts || {};
    const d = state.wdrafts[q.id] = state.wdrafts[q.id] || []; d[+e.target.dataset.wk] = e.target.value; save();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#helpModal").hidden) closeHelp();
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ans")) { e.preventDefault(); doCheck(); }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("wk")) { e.preventDefault(); doWork(); }
});
$("#helpModal").addEventListener("click", e => { if (e.target.id === "helpModal") closeHelp(); });
function doWork() {
  const q = state.questions[state.cur], r = R(q.id);
  if (!$("#wk0") || r.workStatus) return;
  const raws = workFields(q).map((f, i) => $("#wk" + i).value);
  let res;
  try { res = checkWork(q, raws); } catch (err) { r.workLast = { status: "error", msg: err.message }; render(); return; }
  r.workTries++;
  if (r.workFirstOk === null) r.workFirstOk = res.ok;
  r.workLast = { status: res.ok ? "right" : "wrong", msg: res.msg, close: res.close };
  if (res.ok) r.workStatus = "right";
  render();
  if (res.ok) setTimeout(() => $("#ans0") && $("#ans0").focus(), 0);
}
function doCheck() {
  const q = state.questions[state.cur], r = R(q.id);
  if (!$("#ans0") || r.solved || r.revealed) return;
  let res;
  try { res = checkAnswer(q, $("#ans0").value); } catch (err) { res = { status: "error", msg: err.message }; }
  r.last = res;
  if (res.status !== "error") {
    r.attempts++;
    if (r.attempts === 1) r.firstOk = res.status === "correct";
    if (res.round) r.roundIssue = true;
    if (res.status === "correct") r.solved = true;
  }
  render();
  const again = $("#ans0"); if (again && !again.disabled) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
}

/* ---------- Calculator ---------- */
const Calc = {
  ans: 0,
  open(show) {
    $("#calc").hidden = !show; $("#calcBtn").setAttribute("aria-expanded", show);
    $("#calcBtn").classList.toggle("primary", show);
    if (show) setTimeout(() => $("#calcIn").focus(), 0);
  },
  insert(txt) {
    const inp = $("#calcIn"), s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, s) + txt + inp.value.slice(en); const pos = s + txt.length;
    inp.focus(); inp.setSelectionRange(pos, pos);
  },
  run() {
    const out = $("#calcOut"), raw = $("#calcIn").value.trim();
    if (!raw) return;
    try {
      const s = raw.replace(/[−–—]/g, "-").replace(/[×·]/g, "*").replace(/÷/g, "/").replace(/ans/gi, "(" + this.ans + ")").replace(/sqrt/gi, "√");
      const vals = ev(parseExpr(tokenize(s)));
      if (vals.length !== 1) throw new Error("Work out one value at a time (no ±).");
      if (!isFinite(vals[0])) throw new Error("That isn't a real number. Check for a negative under √ or dividing by 0.");
      this.ans = +vals[0].toPrecision(12);
      out.classList.remove("err"); out.textContent = "= " + this.ans;
    } catch (e) { out.classList.add("err"); out.textContent = e.message; }
  },
};
$("#calcBtn").addEventListener("click", () => Calc.open($("#calc").hidden));
$("#calcClose").addEventListener("click", () => Calc.open(false));
$("#calc").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.c !== undefined) Calc.insert(b.dataset.c);
  const fn = b.dataset.cfn;
  if (fn === "clear") { $("#calcIn").value = ""; $("#calcOut").textContent = "0"; $("#calcOut").classList.remove("err"); $("#calcIn").focus(); }
  if (fn === "back") { const i = $("#calcIn"); i.value = i.value.slice(0, -1); i.focus(); }
  if (fn === "ans") Calc.insert("ANS");
  if (fn === "eval") Calc.run();
  if (b.id === "calcUse") {
    let inp = lastInputId && $("#" + lastInputId);
    if (!inp || inp.disabled) inp = [...document.querySelectorAll(".ans, .wk")].find(x => !x.disabled);
    if (!inp) { $("#calcOut").classList.add("err"); $("#calcOut").textContent = "Click an answer box first."; return; }
    inp.value = "" + Calc.ans; inp.dispatchEvent(new Event("input", { bubbles: true })); inp.focus();
  }
});
$("#calcIn").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); Calc.run(); } e.stopPropagation(); });
$("#calcIn").addEventListener("input", e => e.stopPropagation());

/* ---------- Whiteboard ---------- */
const Board = {
  canvas: $("#canvas"), wrap: $("#canvasWrap"), ctx: null, key: null, boards: {},
  color: "#18202c", size: 2.5, erase: false, cur: null,
  init() {
    this.ctx = this.canvas.getContext("2d");
    new ResizeObserver(() => this.resize()).observe(this.wrap);
    const c = this.canvas;
    c.addEventListener("pointerdown", e => this.down(e));
    c.addEventListener("pointermove", e => this.move(e));
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => c.addEventListener(ev, () => this.up()));
    document.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
      this.color = b.dataset.color; this.erase = false;
      document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x === b)); $("#eraser").classList.remove("on");
    }));
    $("#penThin").addEventListener("click", () => { this.size = 2.5; this.erase = false; this.tools("penThin"); });
    $("#penThick").addEventListener("click", () => { this.size = 6; this.erase = false; this.tools("penThick"); });
    $("#eraser").addEventListener("click", () => { this.erase = true; this.tools("eraser"); });
    $("#undo").addEventListener("click", () => this.undo());
    $("#clear").addEventListener("click", () => { const b = this.board(); if (!b.strokes.length) return; b.history.push({ clear: b.strokes }); b.strokes = []; this.redraw(); });
    $("#grid").addEventListener("click", e => { this.wrap.classList.toggle("nogrid"); e.currentTarget.classList.toggle("on"); });
  },
  tools(id) { ["penThin", "penThick", "eraser"].forEach(x => $("#" + x).classList.toggle("on", x === id)); },
  board() { return (this.boards[this.key] = this.boards[this.key] || { strokes: [], history: [] }); },
  setKey(k, title) { $("#boardTitle").textContent = title; if (this.key === k) return; this.key = k; this.redraw(); },
  reset() { this.boards = {}; this.redraw(); },
  resize() {
    const r = this.wrap.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    this.canvas.width = Math.max(1, Math.round(r.width * d)); this.canvas.height = Math.max(1, Math.round(r.height * d));
    this.ctx.setTransform(d, 0, 0, d, 0, 0); this.redraw();
  },
  pt(e) { const r = this.canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; },
  down(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    this.canvas.setPointerCapture(e.pointerId);
    this.cur = { color: this.color, size: this.erase ? 22 : this.size, erase: this.erase, pts: [this.pt(e)] };
    this.drawStroke(this.cur);
  },
  move(e) {
    if (!this.cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of (evs.length ? evs : [e])) {
      const p = this.pt(ce), pts = this.cur.pts, last = pts[pts.length - 1];
      pts.push(p); this.segment(this.cur, last, p);
    }
  },
  up() {
    if (!this.cur) return;
    const b = this.board(); b.strokes.push(this.cur); b.history.push({ stroke: true }); this.cur = null;
  },
  style(s) {
    const x = this.ctx; x.globalCompositeOperation = s.erase ? "destination-out" : "source-over";
    x.strokeStyle = s.color; x.fillStyle = s.color; x.lineWidth = s.size; x.lineCap = "round"; x.lineJoin = "round";
  },
  segment(s, a, b) { const x = this.ctx; this.style(s); x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); },
  drawStroke(s) {
    const x = this.ctx; this.style(s);
    if (s.pts.length === 1) { x.beginPath(); x.arc(s.pts[0][0], s.pts[0][1], s.size / 2, 0, Math.PI * 2); x.fill(); return; }
    x.beginPath(); x.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < s.pts.length; i++) x.lineTo(s.pts[i][0], s.pts[i][1]);
    x.stroke();
  },
  redraw() {
    if (!this.ctx) return;
    const x = this.ctx; x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, this.canvas.width, this.canvas.height); x.restore();
    if (this.key) this.board().strokes.forEach(s => this.drawStroke(s));
    x.globalCompositeOperation = "source-over";
  },
  undo() {
    const b = this.board(), h = b.history.pop(); if (!h) return;
    if (h.clear) b.strokes = h.clear; else b.strokes.pop();
    this.redraw();
  },
};

function measureHeader() { document.documentElement.style.setProperty("--header-h", $("#top").offsetHeight + "px"); }
new ResizeObserver(measureHeader).observe($("#top"));
Board.init();
measureHeader();
render();
</script>
